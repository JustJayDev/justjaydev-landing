<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — JustJayDev</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/webp" sizes="32x32" href="assets/icon-32.webp" />
    <style>
      :root {
        --iron: #0a0604;
        --ink: #e9dcd0;
        --ink-dim: #9c8878;
        --ember: #ff6a2b;
        --gold: #e8a13a;
        --hairline: #2a1c12;
        --serif: "Bitter", Georgia, serif;
        --display: "Azeret Mono", ui-monospace, monospace;
        --white-hot: #fff4e0;
      }
      * { margin:0; padding:0; box-sizing:border-box; }
      body {
        font-family: var(--serif);
        background: var(--iron);
        color: var(--ink);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        overflow-x: hidden;
      }
      body::after {
        content:"";
        position: fixed; inset:0; z-index:0; pointer-events:none;
        background: radial-gradient(60% 50% at 50% 80%, rgba(255,106,43,0.18), transparent 70%);
      }
      .box { position:relative; z-index:1; max-width:480px; width:100%; text-align:center; }
      .code {
        font-family: var(--serif); font-weight:800;
        font-size: clamp(64px, 15vw, 120px); line-height:1.05;
        color: var(--white-hot);
        letter-spacing:-0.02em;
      }
      .code span { color: var(--ember); }
      .msg {
        margin:16px 0 28px; color: var(--ink-dim);
        font-size:15px; line-height:1.6; font-weight:700;
      }
      .msg code {
        font-family: var(--display); font-size:12.5px;
        color: var(--gold); letter-spacing:0.06em;
      }
      .links { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
      .links a {
        font-family: var(--display); font-size:12.5px; font-weight:500;
        letter-spacing:0.03em; text-transform:uppercase;
        display:inline-flex; align-items:center; justify-content:center;
        min-height:48px; padding:0 22px;
        border:1px solid var(--hairline); border-radius:2px;
        color: var(--white-hot); text-decoration:none;
      }
      .links a.primary {
        background: var(--ember); border-color: var(--ember); color:#170803; font-weight:700;
      }
      .links a:hover { border-color: var(--gold); }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="code">4<span>0</span>4</div>
      <p class="msg">
        <code>exit code 404</code><br />page not found — it isn't forged here.<br />Try one of these instead:
      </p>
      <div class="links">
        <a class="primary" href="/">Home</a>
        <a href="/#work">The work</a>
        <a href="/#links">Find me</a>
      </div>
    </div>
  </body>
</html>
